name: RoarZone Playlist Auto Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-roarzone:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install requests

      - name: Run RoarZone Script
        run: python Scripts/roarzone.py

      - name: Commit and Push RoarZone.m3u
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RoarZone.m3u
          git diff --cached --quiet || git commit -m "Auto update RoarZone.m3u"
          git push
